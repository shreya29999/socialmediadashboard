services:
  redis:
    image: redis:7
    container_name: social-dashboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: social-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-dashboard-backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_dashboard
    depends_on:
      - redis
      - postgres

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-dashboard-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_dashboard
    depends_on:
      - redis
      - postgres

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-dashboard-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/social_dashboard
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: